<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" width="device-width" initial-scale="1.0">
        <title>Icons</title>
        <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="https://jsdelivr.net" />
    </head>
    <style>
        body {
            padding: 0%;
            margin: 0%;
            display: flex;
            height: 100%;
            flex-direction: column;
        }
        .header {
            display: flex;
            font-family: 'Oswald', sans-serif;
            height: 10%;
            min-width: 100%;
            align-items: center;
            justify-content: center;
            flex-grow: initial;
            flex: row wrap;
            position: fixed;
            background-color: white;

        }
        .logo {
            margin-right: 380px;
        }
        .icons-header {
            margin-left: inherit;
        }
        .main {
            display: flex;
            max-height: 80%;
            width: 100%;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            margin-top: 20%;
            padding: 0;
        }
        .main-box1 {
            width: 90%;
            height: 500px;
            margin: 2%;
            display: flex;
            border: 10px solid #002255;
            border-radius: 20px;
            box-shadow: 10px 10px 5px grey;
            
        }
        .main-box2,
        .main-box3 {
            width: 42%;
            height: 500px;
            margin: 2%;
            display: flex;
            border: 10px solid #002255 ;
            border-radius: 20px;
            box-shadow: 10px 10px 5px grey;
        }
        .main-box4 {
            width: 90%;
            height: 350px;
            margin: 2%;
            display: flex;
            border: 10px solid #002255;
            border-radius: 20px;
            box-shadow: 10px 10px 5px grey;
        }
        .box-icon1 {
            display: flex;
            height: 450px;
            width: 30%;
            border-right: 5px solid #002255;
            border-radius: 12px;
            margin: 25px;
        }
        .box-content {
            display: flex;
            width: 70%;
            height: 500px;
            flex-wrap: wrap;
            flex-direction: column;

        }
        .box-content-head1 {
            display: flex;
            font-size: 3.5rem;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: 900;
            justify-content: left;
            height: 130px;
            color: #002255;
            margin-top: 25px;
            flex-wrap: wrap;
            flex-direction: row;
        }
        .box-content-sub1 {
            display: flex;
            font-size: 2.3rem;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: 600;
            color: #002255;
            height: 320px;
            justify-content: left;
            flex-wrap: wrap;
            flex-direction: row;
            margin-top: 15px;
            margin-right: 10px;
        }
    </style>
    <body>
      <div class="header">
        <div class="logo"><img src="APEX.svg" height="200px"  width="400px"></div>
        <div class="icons-header">
            <img src="gears-regular-full.svg" height="80px" width="80px">
            <img src="bell-regular-full.svg" height="80px" width="80px">
        </div>
      </div>
      <div class="main">
        <div class="main-box1">
           <div class="box-icon1">
              <img src="weight.svg" height="400px" width="95%">
           </div>
         <div class="box-content">
           <div class="box-content-head1">General Core Test:</div>
           <div class="box-content-sub1">Take strict tests like the real UTME test. The number of questions and time cannot be adjusted in this test.</div>
         </div>
        </div>
        <div class="main-box2"></div>
        <div class="main-box3"></div>
        <div class="main-box4"></div>
      </div>
    </body>
</html
